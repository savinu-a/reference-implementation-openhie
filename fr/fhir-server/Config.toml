# JDBC Database Configuration for db_handler module
[facility_registry.handlers]
dbType = "h2"
dbUrl = "jdbc:h2:./data/fhir-db"
dbUser = "sa"
dbPassword = ""
clearDataOnStartup = false

# Resource ID Generation Configuration
[facility_registry.utils]
dbType = "h2"
useServerGeneratedIds = true

# Root module configuration (service.bal configurable variables)
[facility_registry]
serverName = "OpenHIE Facility Registry"
auditServiceUrl = ""
iti90Enabled = true
iti91Enabled = true
iti130Enabled = false

# Server Base URL Configuration for mappers module
[facility_registry.mappers]
baseUrl = "http://localhost:9090"
